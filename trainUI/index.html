<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RailSearch — Train Route Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="6" width="18" height="12" rx="2"/>
          <path d="M23 13l-4-4v8l4-4z"/>
          <line x1="5" y1="16" x2="5" y2="19"/>
          <line x1="15" y1="16" x2="15" y2="19"/>
        </svg>
      </div>
      RAILSEARCH
    </div>
    <span class="badge">LIVE API</span>
  </header>

  <div class="hero">
    <span class="hero-tag">// Station Route Lookup</span>
    <h1>FIND YOUR<br/>ROUTE</h1>
    <p>Enter station codes to discover available train connections between any two stations.</p>
  </div>

  <div class="search-wrapper">
    <div class="search-card">
      <div class="search-row">
        <div class="field">
          <label for="srcInput">From Station Code</label>
          <input type="text" id="srcInput" placeholder="e.g. NDLS" maxlength="6"/>
        </div>
        <button class="swap-btn" id="swapBtn" title="Swap stations">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
            <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>
        <div class="field">
          <label for="dstInput">To Station Code</label>
          <input type="text" id="dstInput" placeholder="e.g. CST" maxlength="6"/>
        </div>
      </div>
      <button class="search-btn" id="searchBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        SEARCH TRAINS
      </button>
    </div>
  </div>

  <div class="results-wrapper" id="resultsWrapper"></div>

</div>

<script src="app.js"></script>
</body>
</html>
